<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample Bootstrap</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-sm bg-dark navbar-dark">
  <form class="form-inline" action="/action_page.php">
    <input class="form-control mr-sm-2" type="text" placeholder="Search">
    <button class="btn btn-success" type="submit">Search</button>
  </form>
</nav>

<div class="container">

<hr>

    <!-- HEADERS -->
   <div class="jumbotron text-center">
  <h1>My First Bootstrap Page</h1>
  <p>Welcome!!</p> 
</div>
  

    <!-- BUTTONS -->
    <section id="buttons" class="mb-5">
        <h2 class="mb-3">Buttons</h2>
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-warning">Warning</button>
    </section>

    <!-- ALERTS -->
    <section id="alerts" class="mb-5">
        <h2 class="mb-3">Alerts</h2>
        <div class="alert alert-success">Success alert</div>
        <div class="alert alert-info">Info alert</div>
        <div class="alert alert-warning">Warning alert</div>
        <div class="alert alert-danger">Danger alert</div>
    </section>

    <!-- TABLES -->
    <section id="tables" class="mb-5">
        <h2 class="mb-3">Tables</h2>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Role</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Ana</td>
                    <td>Student</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Ben</td>
                    <td>Developer</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Cara</td>
                    <td>Designer</td>
                </tr>
            </tbody>
        </table>
    </section>

    <!-- SPINNERS -->
    <section id="spinners" class="mb-5">
        <h2 class="mb-3">Spinners</h2>
        <div class="spinner-border text-primary"></div>
        <div class="spinner-border text-success"></div>
        <div class="spinner-border text-danger"></div>
    </section>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
