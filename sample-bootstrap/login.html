<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Employee System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="bootstrap/css/style.css" rel="stylesheet">
</head>
<body>

<div class="login-box">
    <h3 class="text-center mb-2">Employee System</h3>
    <p class="text-center mb-4">Sign in to continue</p>

    <!-- USERNAME -->
    <div class="input-group mb-3">
        <span class="input-group-text">
            <i class="bi bi-person-fill"></i>
        </span>
        <input type="text" class="form-control" id="username" placeholder="Username">
    </div>

    <!-- PASSWORD -->
    <div class="input-group mb-4">
        <span class="input-group-text">
            <i class="bi bi-lock-fill"></i>
        </span>
        <input type="password" class="form-control" id="password" placeholder="Password">
    </div>

    <!-- LOGIN BUTTON -->
    <button class="btn btn-primary w-100" onclick="login()">
        <i class="bi bi-box-arrow-in-right"></i> Login
    </button>

    <div class="text-center footer-text">
        © 2026 Employee Information System
    </div>
</div>

<!-- OPTIONAL: your existing JS -->
<script src="bootstrap/js/app.js"></script>

</body>
</html>
