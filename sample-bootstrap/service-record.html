<!DOCTYPE html>
<html>
<head>
    <title>Service Record</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom Style -->
    <link href="bootstrap/css/style.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar px-4">
    <a class="navbar-brand">Service Record</a>
    <a class="nav-link" href="employee-info.html">Back</a>
</nav>

<div class="container mt-4">

    <!-- HEADER CARD -->
    <div class="card p-4 mb-3">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">
                <i class="bi bi-briefcase-fill me-2 text-primary"></i>
                Employee Service History
            </h5>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addServiceModal">
                <i class="bi bi-plus-circle"></i> Add Record
            </button>
        </div>
    </div>

    <!-- SEARCH -->
    <div class="card p-3 mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="Search service record...">
    </div>

    <!-- TABLE -->
    <div class="card p-3">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Position</th>
                    <th>Department</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th width="90" class="text-center">Action</th>
                </tr>
            </thead>
            <tbody id="serviceBody">
                <tr>
                    <td>1</td>
                    <td>Administrative Clerk</td>
                    <td>HR Office</td>
                    <td>2021-01-15</td>
                    <td>2022-06-30</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-danger" onclick="deleteRecord(this)">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Records Officer</td>
                    <td>Registrar</td>
                    <td>2022-07-01</td>
                    <td>2023-12-31</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-danger" onclick="deleteRecord(this)">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Senior Clerk</td>
                    <td>Administration</td>
                    <td>2024-01-01</td>
                    <td>Present</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-danger" onclick="deleteRecord(this)">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- ADD SERVICE RECORD MODAL -->
<div class="modal fade" id="addServiceModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-plus-circle me-2"></i>Add Service Record
                </h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <input id="position" class="form-control" placeholder="Position">
                    </div>
                    <div class="col-md-6">
                        <input id="department" class="form-control" placeholder="Department">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Start Date</label>
                        <input id="startDate" type="date" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">End Date</label>
                        <input id="endDate" type="text" class="form-control" placeholder="YYYY-MM-DD or Present">
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="addService()">Save</button>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
let serviceId = 4;

// ADD SERVICE RECORD
function addService() {
    const pos = position.value.trim();
    const dept = department.value.trim();
    const start = startDate.value;
    const end = endDate.value.trim();

    if (!pos || !dept || !start || !end) {
        alert("Please complete all fields");
        return;
    }

    serviceBody.insertAdjacentHTML("beforeend", `
        <tr>
            <td>${serviceId++}</td>
            <td>${pos}</td>
            <td>${dept}</td>
            <td>${start}</td>
            <td>${end}</td>
            <td class="text-center">
                <button class="btn btn-sm btn-danger" onclick="deleteRecord(this)">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
    `);

    position.value = "";
    department.value = "";
    startDate.value = "";
    endDate.value = "";

    bootstrap.Modal.getInstance(addServiceModal).hide();
}

// DELETE RECORD
function deleteRecord(btn) {
    if (confirm("Delete this service record?")) {
        btn.closest("tr").remove();
    }
}

// SEARCH
searchInput.addEventListener("keyup", () => {
    const filter = searchInput.value.toLowerCase();
    document.querySelectorAll("#serviceBody tr").forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
    });
});
</script>

</body>
</html>
